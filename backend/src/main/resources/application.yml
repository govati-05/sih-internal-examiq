server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/examiq}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  jwt:
    # JWT_SECRET must be set as an environment variable — there is no built-in
    # default. Copy .env.example to .env and set a real value (see README).
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8001}
  storage:
    path: ${FILE_STORAGE_PATH:./storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.springframework.security: INFO
    com.examiq: INFO
